<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Budget Tracker</h1>
  </header>

  <div id="setup-panel" class="setup-panel">
    <h2>Set Your Budget</h2>
    <input type="number" id="budget-amount-input" placeholder="Starting budget (e.g. 500)">
    <button id="set-budget-btn">Set Budget</button>
  </div>

  <div id="dashboard" class="dashboard">
<div class="ring-container">
  <svg width="150" height="150" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="65" stroke="#eee" stroke-width="12" fill="none"/>
    <circle id="progress-ring" cx="75" cy="75" r="65" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round"/>
  </svg>
  <p id="ring-label" class="ring-label">RM 0.00</p>
</div>
<button id="show-track-btn">Track</button>
  <div id="expense-adder" class="expense-adder">
      <input type="text" id="expense-name-input" placeholder="What did you spend on?">
      <input type="number" id="expense-amount-input" placeholder="Amount">
      <select id="expense-category-input">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Self-Improvement">Self Improvement</option>
        <option value="Fun">Fun</option>
        <option value="Other">Other</option>
      </select>
      <button id="add-expense-btn">Add Expense</button>
    </div>

    <ul id="expense-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
